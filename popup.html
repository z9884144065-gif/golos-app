<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            margin: 0;
            background-color: #f9f9fa;
        }
        h3 { margin-top: 0; color: #2c3e50; font-size: 16px; text-align: center; }
        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background-color: #4c6ef5;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #3b5bdb; }
        .btn-silent { background-color: #10b981; }
        .btn-silent:hover { background-color: #059669; }
        #status {
            font-size: 12px;
            color: #718096;
            text-align: center;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h3>🗣️ Golos-App Виджет</h3>
    
    <button class="btn" id="start-voice">🎙️ Голосовой ввод на лету</button>
    <button class="btn btn-silent" id="start-silent">🤫 Бесшумный ввод (Губы)</button>
    
    <div id="status">Готов к работе поверх любого сайта...</div>

    <script>
        // Этот скрипт связывает кнопку в окошке с нашим ИИ-сервером, который мы запустили в Codespaces
        const statusDiv = document.getElementById('status');
        
        document.getElementById('start-voice').addEventListener('click', async () => {
            statusDiv.innerText = "🎙️ Слушаю вашу речь...";
            // Здесь расширение активирует микрофон и отправляет поток на наш бесплатный ИИ
        });

        document.getElementById('start-silent').addEventListener('click', () => {
            statusDiv.innerText = "🤫 Камера сканирует мимику губ...";
            // Здесь расширение активирует веб-камеру для бесшумного считывания
        });
    </script>
</body>
</html>
